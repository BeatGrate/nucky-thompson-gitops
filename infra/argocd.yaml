apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.3.4 # Recommended: Check for the latest version
    helm:
      values: |
        global:
          domain: argocd.mi6.com
        server:
          insecure: true
          httproute:
            enabled: true
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
                sectionName: web
            hostnames:
              - "argocd.mi6.com"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: argocd-server
                    port: 80

        configs:
          cm:
            ui.bannercontent: "🚀 Mi6 ArgoCD"
            timeout.relogin: "72h" # Stop getting logged out every hour
            
            # Health Check for Cert-Manager (Shows "Healthy" in UI when cert is ready)
            resource.customizations: |
              cert-manager.io/Certificate:
                health.lua: |
                  hs = {}
                  if obj.status ~= nil and obj.status.conditions ~= nil then
                    for i, condition in ipairs(obj.status.conditions) do
                      if condition.type == "Ready" and condition.status == "True" then
                        hs.status = "Healthy"
                        hs.message = "Certificate is ready"
                        return hs
                      end
                    end
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for certificate"
                  return hs

        controller:
          statusProcessors: 20
          operationProcessors: 10

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # --- SYNC POLICY ---
  # Initially empty for safe adoption. 
  # Once synced manually, uncomment the automated block below.
  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
