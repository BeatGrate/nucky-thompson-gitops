apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes-sigs.github.io/gateway-api
    chart: gateway-api
    targetRevision: v1.4.1   # change to the version you want
    helm:
      releaseName: gateway-api
      values: |
        installCRDs: true

  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

