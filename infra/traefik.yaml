apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  destination:
    server: "https://kubernetes.default.svc"
    namespace: traefik
  sources:
    - repoURL: https://traefik.github.io/charts # Traefik Helm chart repository URL
      chart: traefik
      targetRevision: v38.0.2 # Use a specific chart version (e.g., "  # Optional: Configure sync policy for automatic deployment
      helm:
values: |
        # 1. Network: Bind Traefik directly to Node IP (80/443)
        hostNetwork: true
        deployment:
          kind: Deployment
          replicas: 1 
        
        # 2. Providers: Enable Gateway API
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true

        # 3. Gateway Resource: Create the 'traefik-gateway' object
        gateway:
          enabled: true
          listeners:
            web:
              port: 80
              protocol: HTTP
              namespacePolicy:
                from: All
            websecure:
              port: 443
              protocol: HTTPS
              namespacePolicy:
                from: All

        # 4. Ports: Ensure host mapping is active
        ports:
          web:
            port: 80
            hostPort: 80
          websecure:
            port: 443
            hostPort: 443

        # 5. Service: Use ClusterIP (HostNetwork handles the outside reach)
        service:
          type: ClusterIP
  syncPolicy:
    automated:
      prune: true # Allows ArgoCD to delete resources that are no longer in Git
      selfHeal: true # Allows ArgoCD to sync changes if the live state drifts from Git
    syncOptions:
      # Automatically create the destination namespace if it doesn't exist
      - CreateNamespace=true

