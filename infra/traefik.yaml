apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 38.0.2
    helm:
      values: |
        # 1. Network: Bind Traefik directly to Node IP (80/443)
        hostNetwork: true
        deployment:
          kind: Deployment
          replicas: 1 
        
        # 2. Providers: Enable Gateway API
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true

        # 3. Gateway Resource: Create the 'traefik-gateway' object
        gateway:
          enabled: true
          listeners:
            web:
              port: 80
              protocol: HTTP
              namespacePolicy:
                from: All
            websecure:
              port: 443
              protocol: HTTPS
              namespacePolicy:
                from: All
              tls:
                mode: Terminate
                certificateRefs:
                  - name: argocd-server-tls
                    kind: Secret

        # 4. Ports: Ensure host mapping is active
        ports:
          web:
            port: 80
            hostPort: 80
          websecure:
            port: 443
            hostPort: 443

        # 5. Service: Use ClusterIP (HostNetwork handles the outside reach)
        service:
          type: ClusterIP

  destination:
    server: "https://kubernetes.default.svc"
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
